
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071A3B">
    <title>JAFUNG Online</title>

    <!-- Favicon tetap dipertahankan -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #071A3B;
        }

        /* Aplikasi utama */
        #appFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            opacity: 0;
            transition: opacity .45s ease;
        }

        #appFrame.ready {
            opacity: 1;
        }

        /* Layar pembuka */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 24px;
            color: #fff;
            text-align: center;
            background:
                radial-gradient(
                    circle at 50% 38%,
                    rgba(35, 110, 220, .34),
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #06142E,
                    #103B78 55%,
                    #071A3B
                );
            transition: opacity .4s ease, visibility .4s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Lingkaran teknologi */
        .logo-wrap {
            position: relative;
            width: 104px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            isolation: isolate;
        }

        .logo-wrap::before,
        .logo-wrap::after {
            content: "";
            position: absolute;
            inset: -8px;
            border: 1px solid rgba(125, 190, 255, .65);
            border-radius: 50%;
            pointer-events: none;
            transform-origin: center;
            animation: orbit 3s linear infinite;
            -webkit-animation: orbit 3s linear infinite;
        }

        .logo-wrap::after {
            inset: -16px;
            border-color: rgba(125, 190, 255, .3);
            border-style: dashed;
            animation-direction: reverse;
            animation-duration: 5s;
            -webkit-animation-direction: reverse;
            -webkit-animation-duration: 5s;
        }

        /* Logo memakai favicon.ico yang sudah ada */
        .logo {
            display: block;
            position: relative;
            z-index: 1;
            width: 88px;
            height: 88px;
            object-fit: contain;
            padding: 8px;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 0 28px rgba(76, 165, 255, .4);
            transform-origin: center;
            animation: breathe 2s ease-in-out infinite;
            -webkit-animation: breathe 2s ease-in-out infinite;
        }

        .app-title {
            margin: 8px 0 0;
            font-size: clamp(25px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: .5px;
            text-shadow: 0 0 18px rgba(92, 170, 255, .4);
        }

        .subtitle {
            margin: 0;
            color: #C7DEFF;
            font-size: 13px;
            letter-spacing: .3px;
        }

        .loading-area {
            width: min(230px, 75vw);
            margin-top: 20px;
        }

        /* Jalur loading */
        .progress-track {
            position: relative;
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 20px;
            background: rgba(255, 255, 255, .20);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            isolation: isolate;
        }

        /* Garis bergerak: menggunakan left agar lebih kompatibel */
        .progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #60A5FA,
                #FFFFFF,
                #60A5FA
            );
            box-shadow: 0 0 10px rgba(96, 165, 250, .8);
            will-change: left;
            animation: progressMobile 1.3s linear infinite;
            -webkit-animation: progressMobile 1.3s linear infinite;
        }

        .loading-text {
            margin-top: 13px;
            color: #D6E7FF;
            font-size: 12px;
            animation: pulse 1.5s ease-in-out infinite;
            -webkit-animation: pulse 1.5s ease-in-out infinite;
        }

        .footer {
            position: absolute;
            bottom: 22px;
            color: rgba(220, 235, 255, .65);
            font-size: 10px;
            letter-spacing: .5px;
        }

        /* Animasi lingkaran */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @-webkit-keyframes orbit {
            from { -webkit-transform: rotate(0deg); }
            to   { -webkit-transform: rotate(360deg); }
        }

        /* Animasi logo */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.045); }
        }

        @-webkit-keyframes breathe {
            0%, 100% { -webkit-transform: scale(1); }
            50%      { -webkit-transform: scale(1.045); }
        }

        /* Animasi garis loading */
        @keyframes progressMobile {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        @-webkit-keyframes progressMobile {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        /* Animasi teks */
        @keyframes pulse {
            0%, 100% { opacity: .65; }
            50%      { opacity: 1; }
        }

        @-webkit-keyframes pulse {
            0%, 100% { opacity: .65; }
            50%      { opacity: 1; }
        }

        /* Tetap menghormati pengaturan aksesibilitas pengguna */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                -webkit-animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                -webkit-animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Layar loading -->
    <div id="loader" role="status" aria-live="polite">

        <div class="logo-wrap">
            <img
                class="logo"
                src="favicon.ico?v=2"
                alt="Logo JAFUNG Online"
            >
        </div>

        <h1 class="app-title">JAFUNG Online</h1>

        <p class="subtitle">
            Layanan Jabatan Fungsional Berbasis Elektronik
        </p>

        <div class="loading-area">
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>

            <div class="loading-text">
                Menghubungkan ke aplikasi...
            </div>
        </div>

        <div class="footer"></div>
    </div>

    <!-- Aplikasi Google Apps Script: URL tetap -->
    <iframe
        id="appFrame"
        title="Aplikasi JAFUNG Online"
        src="https://script.google.com/macros/s/AKfycbx2_cfubjPRa_jQEs65VCz9uo3IDVL6f-EkIlUqhH8ouSbRame6NCJn9BXXUmi1oQX0/exec"
        allow="clipboard-read; clipboard-write"
        onload="hideLoader()"
    ></iframe>

    <script>
        (function () {
            var loader = document.getElementById('loader');
            var frame = document.getElementById('appFrame');
            var finished = false;

            window.hideLoader = function () {
                if (finished) return;
                finished = true;

                frame.classList.add('ready');
                loader.classList.add('hide');

                setTimeout(function () {
                    if (loader.parentNode) {
                        loader.parentNode.removeChild(loader);
                    }
                }, 500);
            };
        })();
    </script>

</body>
</html>
