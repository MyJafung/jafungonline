<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Apps Script App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Ganti src di bawah ini dengan URL Web App Apps Script Anda -->
    <iframe src="https://script.google.com/macros/s/AKfycbx2_cfubjPRa_jQEs65VCz9uo3IDVL6f-EkIlUqhH8ouSbRame6NCJn9BXXUmi1oQX0/exec></iframe>

    <script>
        // Mendaftarkan Service Worker sederhana (Syarat wajib PWA / Add to Homescreen)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.log('Service Worker Gagal:', err);
            });
        }
    </script>
</body>
</html>
